name: Build GeoExplorer WAR
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 0. Клонируем без сабмодулей (будем подменять URL)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # 1. Меняем git:// и ssh → https://, чтобы сабмодули тянулись
      - run: |
          git config --global url."https://".insteadOf git://
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule sync --recursive

      # 2. Качаем сабмодули
      - run: git submodule update --init --recursive --depth 1

      # 3. Ставим JDK 8 и Apache Ivy (Ant подтянем сразу)
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - run: sudo apt-get update && sudo apt-get install -y ant ant-optional ivy

      # 4. ant init — внешние JS/CSS
      - run: ant init

      # 5. ant dist — полная сборка (ringojs теперь компилится без ошибок)
      - run: ant dist

      # 6. Артефакт
      - uses: actions/upload-artifact@v4
        with:
          name: geoexplorer-war
          path: build/geoexplorer/geoexplorer.war
